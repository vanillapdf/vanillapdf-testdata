name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.14'

      - name: Validate manifest
        run: python scripts/validate_manifest.py --strict

      # Dry-run the release on every change: build the same archives
      # release.yml would publish, prove they verify and round-trip back to
      # the source tree, and expose them as a workflow artifact. Consumers can
      # trial a PR's corpus (e.g. pin the archives via file:// URLs) without
      # cutting a release.
      - name: Build release archives
        run: python scripts/build_release.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Verify archives round-trip
        run: |
          for name in corpus broken analysis; do
            mkdir "/tmp/extract-$name"
            tar -xzf "dist/$name.tar.gz" -C "/tmp/extract-$name"
            diff -r "/tmp/extract-$name/$name" "$name"
            cmp "/tmp/extract-$name/manifest.json" manifest.json
          done

      - name: Upload candidate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14
